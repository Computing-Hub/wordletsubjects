<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22313A">
<meta name="description" content="Key Terms: a word-guessing revision game from Le Rocquier School.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Key Terms">
<title>Key Terms | Le Rocquier School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EBEFEC; --grid:rgba(34,49,58,.07); --ink:#22313A; --ink-soft:#56656D; --line:#B6C1C3; --panel:#F7F9F7;
  --correct:#2E7D4F; --present:#BF8A12; --absent:#78838A; --on-tile:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141B1F; --grid:rgba(227,233,234,.05); --ink:#E3E9EA; --ink-soft:#9DABB1; --line:#3A474D; --panel:#1C2529;
    --correct:#3A9A62; --present:#C99A2E; --absent:#4A555B;
  }
}
:root[data-theme="dark"]{
  --paper:#141B1F; --grid:rgba(227,233,234,.05); --ink:#E3E9EA; --ink-soft:#9DABB1; --line:#3A474D; --panel:#1C2529;
  --correct:#3A9A62; --present:#C99A2E; --absent:#4A555B;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;
}
.wrap{min-height:100%;max-width:560px;margin:0 auto;padding:28px 20px 20px;display:flex;flex-direction:column;gap:26px}
.school{margin:0;font-weight:700;font-size:20px}
main{flex:1;display:flex;flex-direction:column;gap:22px}
.stamp{font-family:"Saira Stencil One","Arial Black",sans-serif;font-size:clamp(60px,19vw,96px);line-height:.92;margin:0;letter-spacing:.02em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(60%,180px)}
.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:4px;color:var(--on-tile);
  font-family:"Saira Stencil One",sans-serif;font-size:clamp(24px,8vw,36px);background:var(--absent);animation:flip .5s ease both}
.tile.c{background:var(--correct)} .tile.p{background:var(--present)}
.tile:nth-child(2){animation-delay:.1s}.tile:nth-child(3){animation-delay:.2s}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.intro{margin:0;font-size:19px;max-width:36ch}
.dept h2{margin:0 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.subjects{display:grid;gap:8px}
.subj{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--ink);
  background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--ink);border-radius:6px;padding:13px 16px;font-weight:700;font-size:18px}
.subj span{white-space:nowrap;font-weight:500;font-size:14px;color:var(--ink-soft)}
.subj:hover{border-color:var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--present);outline-offset:2px}
.secondary{background:transparent;border:2px solid var(--ink);color:var(--ink);border-radius:6px;padding:13px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;width:100%}
.hint{margin:0;color:var(--ink-soft);font-size:15px}
footer{border-top:1px solid var(--line);padding-top:14px;color:var(--ink-soft);font-size:14px}
footer p{margin:0}
@media (prefers-reduced-motion:reduce){.tile{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><p class="school">Le Rocquier School</p></header>

  <main>
    <div class="tiles" aria-hidden="true"><span class="tile c">K</span><span class="tile p">E</span><span class="tile">Y</span></div>
    <h1 class="stamp">Key<br>Terms</h1>
    <p class="intro">Read the clue or look at the picture, guess the term, then answer a follow-up question to check you understand it.</p>
    <div id="depts" style="display:grid;gap:20px"></div>
    <button class="secondary" id="installBtn" hidden>Install on this device</button>
    <p class="hint" id="iosHint" hidden>To install on iPhone or iPad, tap Share, then Add to Home Screen.</p>
  </main>

  <footer><p>© 2026 Le Rocquier School.</p></footer>
</div>

<script src="banks/banks.js"></script>
<script>
const depts = {};
(window.BANKS || []).forEach(b => (depts[b.department] = depts[b.department] || []).push(b));
const root = document.getElementById("depts");
Object.entries(depts).forEach(([dept, banks]) => {
  const sec = document.createElement("section"); sec.className = "dept";
  const h = document.createElement("h2"); h.textContent = dept;
  const list = document.createElement("div"); list.className = "subjects";
  banks.forEach(b => {
    const a = document.createElement("a"); a.className = "subj"; a.href = "play.html?subject=" + encodeURIComponent(b.id);
    a.textContent = b.subject;
    const n = document.createElement("span"); n.textContent = b.items.length + " terms"; a.appendChild(n);
    list.appendChild(a);
  });
  sec.append(h, list); root.appendChild(sec);
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let deferred = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferred = e;
  if (!standalone) document.getElementById("installBtn").hidden = false;
});
document.getElementById("installBtn").addEventListener("click", async () => {
  if (!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred = null;
  document.getElementById("installBtn").hidden = true;
});
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (ios && !standalone) document.getElementById("iosHint").hidden = false;
</script>
</body>
</html>
